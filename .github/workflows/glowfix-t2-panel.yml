         name: Build X00TD A16 GlowFix T2 Panel Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GlowFix T2 Panel Kernel
    runs-on: ubuntu-22.04

    env:
      ZIP_NAME: X00TD-A16-GlowFixT2-Panel-4.19-Kernel.zip
      LOCALVERSION: -X00TD-A16-GlowFixT2

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: fourteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex git \
            libncurses-dev libelf-dev liblz4-tool libssl-dev \
            libxml2 libxml2-utils lzop rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev unzip \
            device-tree-compiler cpio python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            clang llvm lld

      - name: Clone Clang Toolchain
        run: |
          git clone --depth=1 -b 14 https://github.com/ZyCromerZ/Clang.git "$HOME/clang"

      - name: Apply Build Patches
        run: |
          find scripts/dtc/ -type f -name "dtc-lexer.l" \
            -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} + 2>/dev/null || true
          find scripts/dtc/ -type f -name "dtc-lexer.lex.c_shipped" \
            -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} + 2>/dev/null || true

      - name: Apply GlowFix T2 Panel DTS Patch
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          panel_files = [
              Path("arch/arm64/boot/dts/vendor/qcom/X00TD/dsi-panel-nt36672-1080p-video-txd.dtsi"),
              Path("arch/arm64/boot/dts/vendor/qcom/X00TD/dsi-panel-nt36672-1080p-video.dtsi"),
              Path("arch/arm64/boot/dts/vendor/qcom/X00TD/dsi-panel-td4310-1080p-video-txd.dtsi"),
          ]

          dynamic_block = """\
          \t\tqcom,mdss-dsi-panel-framerate = <60>;
          \t\tqcom,mdss-dsi-pan-enable-dynamic-bitclk;
          \t\tqcom,mdss-dsi-dynamic-bitclk_freq = <0x2f942f40 0x2fc75ca0 0x2ffa8a00 0x302db760 0x3060e4c0>;
          \t\tqcom,mdss-dsi-pan-enable-dynamic-fps;
          \t\tqcom,mdss-dsi-pan-fps-update = "dfps_immediate_porch_mode_vfp";
          """

          for path in panel_files:
              if not path.exists():
                  raise SystemExit(f"Missing panel file: {path}")

              text = path.read_text()

              if "qcom,mdss-dsi-pan-enable-dynamic-bitclk;" not in text:
                  text = text.replace(
                      "\t\tqcom,mdss-dsi-panel-framerate = <60>;\n",
                      dynamic_block,
                      1,
                  )

              if "qcom,mdss-dsi-bl-default-level" not in text:
                  text = text.replace(
                      "\t\tqcom,mdss-dsi-bl-max-level = <3259>;\n",
                      "\t\tqcom,mdss-dsi-bl-max-level = <3259>;\n"
                      "\t\tqcom,mdss-dsi-bl-default-level = <1140>;\n",
                      1,
                  )

              text = text.replace(
                  "qcom,mdss-dsi-off-command = [05 01 00 00 32 00 02 28 00",
                  "qcom,mdss-dsi-off-command = [05 01 00 00 14 00 02 28 00",
                  1,
              )

              path.write_text(text)

          nt_txd = panel_files[0]
          text = nt_txd.read_text()
          text = text.replace(
              "\t\t\t05 01 00 00 46 00 02 11 00\n"
              "\t\t\t05 01 00 00 0A 00 02 29 00];",
              "\t\t\t05 01 00 00 78 00 02 11 00\n"
              "\t\t\t05 01 00 00 14 00 02 29 00];",
              1,
          )
          nt_txd.write_text(text)

          nt_plain = panel_files[1]
          text = nt_plain.read_text()
          text = text.replace(
              "            05 01 00 00 70 00 01 11\n"
              "            05 01 00 00 05 00 01 29];",
              "            05 01 00 00 78 00 01 11\n"
              "            05 01 00 00 14 00 01 29];",
              1,
          )
          nt_plain.write_text(text)

          td = panel_files[2]
          text = td.read_text()
          text = text.replace(
              "\t\t\t05 01 00 00 96 00 02 11 00\n"
              "\t\t\t05 01 00 00 50 00 02 29 00];",
              "\t\t\t05 01 00 00 78 00 02 11 00\n"
              "\t\t\t05 01 00 00 28 00 02 29 00];",
              1,
          )
          td.write_text(text)
          PY

          grep -Rni "dynamic-bitclk\|dynamic-fps\|bl-default-level\|05 01 00 00 78 00" \
            arch/arm64/boot/dts/vendor/qcom/X00TD/dsi-panel-*.dtsi

      - name: Generate Defconfig
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          mkdir -p out

          DEFCONFIG_FILE=$(find arch/arm64/configs -type f -iname "*x00td*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG_FILE" ]; then
            DEFCONFIG_FILE=$(find arch/arm64/configs -type f -iname "*sdm660*perf_defconfig*" | head -n 1)
          fi
          if [ -z "$DEFCONFIG_FILE" ]; then
            echo "No suitable X00TD/SDM660 defconfig found."
            exit 1
          fi

          DEFCONFIG_NAME=$(echo "$DEFCONFIG_FILE" | sed 's|arch/arm64/configs/||')
          echo "Using defconfig: $DEFCONFIG_NAME"
          make O=out ARCH=arm64 "$DEFCONFIG_NAME"

          scripts/config --file out/.config \
            -e ANDROID_BINDER_IPC \
            -e ANDROID_BINDERFS \
            -e ASHMEM \
            -e BPF_SYSCALL \
            -e CGROUPS \
            -e MEMCG \
            -e NET_CLS_ACT \
            -e NET_CLS_BPF \
            -e NET_SCH_INGRESS \
            -e SECCOMP \
            -e SECCOMP_FILTER \
            -e TMPFS_XATTR \
            -e TMPFS_POSIX_ACL \
            -e DEVTMPFS \
            -e DEVTMPFS_MOUNT || true

          scripts/config --file out/.config \
            -d DEBUG_INFO \
            -d DEBUG_KERNEL \
            -d LOCALVERSION_AUTO || true

          scripts/config --file out/.config \
            --set-str LOCALVERSION "$LOCALVERSION" \
            --set-str SYSTEM_TRUSTED_KEYS "" \
            --set-str SYSTEM_REVOCATION_KEYS "" || true

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=/usr/bin/ld.lld \
            AR=/usr/bin/llvm-ar \
            NM=/usr/bin/llvm-nm \
            OBJCOPY=/usr/bin/llvm-objcopy \
            OBJDUMP=/usr/bin/llvm-objdump \
            STRIP=/usr/bin/llvm-strip \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -fcommon" \
            2>&1 | tee kernel-build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glowfix-t2-panel-kernel-build-log
          path: kernel-build.log

      - name: Verify Kernel Output
        run: |
          BOOT_DIR="out/arch/arm64/boot"
          if [ ! -f "$BOOT_DIR/Image.gz-dtb" ] && [ ! -f "$BOOT_DIR/Image.gz" ]; then
            echo "No kernel image found."
            exit 1
          fi

      - name: Package Flashable Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$HOME/AnyKernel3"
          rm -rf "$HOME/AnyKernel3/.git"
          rm -f "$HOME/AnyKernel3/README.md"
          cd "$HOME/AnyKernel3"

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ### X00TD Android 16 GlowFix T2 Panel Kernel

          properties() { '
          kernel.string=X00TD Android 16 GlowFix T2 Panel 4.19 Kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=X00TD
          device.name2=X00T
          device.name3=ASUS_X00TD
          device.name4=ZB601KL
          device.name5=ZB602KL
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
            set_perm_recursive 0 0 755 644 $RAMDISK/*;
            set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          block=boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          sed -i 's/^          //' anykernel.sh

          BOOT_DIR="$GITHUB_WORKSPACE/out/arch/arm64/boot"
          if [ -f "$BOOT_DIR/Image.gz-dtb" ]; then
            cp "$BOOT_DIR/Image.gz-dtb" Image.gz-dtb
          else
            cp "$BOOT_DIR/Image.gz" Image.gz
          fi

          zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" *
          unzip -t "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-A16-GlowFixT2-Panel-Kernel
          path: X00TD-A16-GlowFixT2-Panel-4.19-Kernel.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x00td-a16-glowfix-t2-panel-${{ github.run_number }}
          name: X00TD Android 16 GlowFix T2 Panel Kernel ${{ github.run_number }}
          files: X00TD-A16-GlowFixT2-Panel-4.19-Kernel.zip
